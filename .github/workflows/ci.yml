# Controleert elke push en pull request: typecheck, lint, tests en of de app bundelt.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - name: Bundelt de app (web, als snelle rooktest)
        run: npx expo export --platform web
      - name: Expo Doctor
        run: npx expo-doctor
